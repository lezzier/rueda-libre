<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-[#14213D] text-[#FAF6EF]">
    <main class="mx-auto w-full max-w-3xl px-6 py-16">
        <section class="space-y-6">
            <p class="m-0 text-sm font-semibold uppercase tracking-widest text-[#F39A2B]">Nuevo · Jueves a sábado</p>
            <h1 class="text-4xl font-bold leading-tight">Rueda Nocturna</h1>
            <p class="max-w-xl text-lg leading-relaxed">Descubre Medellín en bici cuando se encienden las luces</p>
            <div class="flex flex-wrap gap-8">
                <p class="text-xl font-semibold">3 rutas</p>
                <p class="text-xl font-semibold">Desde $55.000</p>
            </div>
            <div class="flex flex-wrap gap-4">
                <a href="#incio" class="inline-block rounded-md bg-transparent border px-6 py-3 font-semibold uppercase tracking-wide border-orange-500 no-underline text-orange-500 hover:bg-orange-500 hover:text-white hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-200 focus:ring-offset-2 focus:ring-offset-[#14213D]">Inicio</a>
                <a href="#flota" class="inline-block rounded-md bg-orange-700 px-6 py-3 text-base font-bold uppercase tracking-wide text-white no-underline hover:bg-orange-500 hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-200 focus:ring-offset-2 focus:ring-offset-[#14213D]">Ver Flota</a>
                <a href="#inscripcion" class="inline-block rounded-md bg-green-700 px-6 py-3 text-base font-semibold uppercase tracking-wide text-white no-underline hover:bg-green-500 hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-green-200 focus:ring-offset-2 focus:ring-offset-[#14213D]">Inscríbete</a>
            </div>
        </section>
    </main>
</body>
</html>
