<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#14213D] text-[#FAF6EF]">
    <main class="mx-auto w-full max-w-3xl px-6 py-16">
        <section class="space-y-6">
            <p class="m-0 text-sm font-semibold uppercase tracking-widest text-[#F39A2B]">Nuevo · Jueves a sábado</p>

            <p class="max-w-xl text-lg leading-relaxed">Descubre Medellín en bici cuando se encienden las luces</p>
            <div class="flex flex-wrap gap-8">
                <p class="text-xl font-semibold">3 rutas</p>
                <p class="text-xl font-semibold">Desde $55.000</p>
            </div>
            <p>
                <a href="#inscripcion" class="inline-block rounded-md bg-[#1E7A4F] px-6 py-3 text-base font-semibold uppercase tracking-wide text-white no-underline hover:bg-[#F39A2B] hover:text-[#14213D]">Inscríbete</a>
            </p>
        </section>
    </main>
</body>
</html>
